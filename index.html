<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registro de Jornada</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="card" id="card-top">
            <div class="card-header">
                <h2>Registro de horas trabajadas</h2>
            </div>
            <div class="card-body">
                <form>
                    <label>Empleado/a:</label>
                    <input id="nombre-empleado" type="text" placeholder="Nombre completo" />
                    
                    <label>Puesto:</label>
                    <input id="puesto-empleado" type="text" placeholder="Ej: Administrativo" />
                    
                    <br />
                    <label>Período:</label> 
<input id="periodo-inicio" type="date" /><input id="periodo-fin" type="date" />
<button id="btn-pdf" type="button" style="margin-left: 15px; padding: 5px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; vertical-align: middle;">
    <i class="fa-solid fa-file-pdf"></i> Descargar PDF
</button>
                </form>
            </div>
        </div>

        <div class="card-2" id="card-middle">
            <table>
                <thead>
                    <tr><th>Día</th>
                        <th class="col-fecha">Fecha</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Total</th>
                        <th>Notas</th>
                    </tr>
                </thead>
                <tbody class="card-body"></tbody>
            </table>
        </div>

        <div class="card" id="card-bottom">
            <table>
                <thead>
                    <tr>
                        <th>Hrs. Totales</th>
                        <th>Hrs. Contrato</th>
                        <th>Hrs. Extra</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="total-periodo">00:00</td>
                        <td><input type="number" id="horas-contrato" placeholder="0" /></td>
                        <td id="horas-extra">00:00</td>
                    </tr>
                </tbody>
            </table>
        </div>

<div id="toast-guardado" style="position: fixed; top: 200px; left: 50%; transform: translateX(-50%); background: #28a745; color: #fff; padding: 10px 20px; border-radius: 5px; font-family: sans-serif; font-size: 14px; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 9999;">Cambios guardados 😁👌🏻</div>

        <script src="scripts.js"></script>
        <script>
            function ajustarMargenes() {
                const cardTop = document.getElementById("card-top");
                const cardBottom = document.getElementById("card-bottom");
                const cardMiddle = document.getElementById("card-middle");
                if (cardTop && cardBottom && cardMiddle) {
                    const alturaTop = cardTop.offsetHeight;
                    const alturaBottom = cardBottom.offsetHeight;
                    cardMiddle.style.marginTop = `${alturaTop}px`;
                    cardMiddle.style.marginBottom = `${alturaBottom}px`;
                    cardMiddle.style.height = `calc(100vh - ${alturaTop + alturaBottom}px)`;
                }
            }
            window.addEventListener("DOMContentLoaded", ajustarMargenes);
            window.addEventListener("resize", ajustarMargenes);
        </script>
    </body>
</html>
